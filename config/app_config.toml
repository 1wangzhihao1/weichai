# 潍柴订单分拣智能调度/仿真统一配置
# 说明：
# 1. 原始 Excel 数据统一放在 raw_data 下。
# 2. 程序生成的库存快照、结果、模型分别放在 data 和 output 下。
# 3. 后续切换测试日期时，优先修改 datasets.active_date 和 simulation 默认项。

[app]
# 后端服务端口。server.py 当前仍以 8088 启动，后续可统一接入此配置。
backend_port = 8088

# 前端或脚本调用后端 API 的默认地址。
api_base_url = "http://127.0.0.1:8088/api/v1"


[datasets]
# 当前用于日订单/库存测试的业务日期。
# 对应目录：raw_data/daily/<active_date>/
active_date = "2025-07-01"

# 历史大盘拣选数据，用于强化学习训练、历史回放、生成订单波次等。
historical_picking_excel = "raw_data/historical/picking/2025-06-25_拣选.XLSX"

# 每日业务数据根目录。
# 推荐结构：
# raw_data/daily/YYYY-MM-DD/picking/
# raw_data/daily/YYYY-MM-DD/inventory/
daily_data_root = "raw_data/daily"


[inventory]
# 程序生成的库存快照 JSON 缓存目录。
cache_dir = "data/inventory"

# 日初库存文件名关键字。程序会在 raw_data/daily/<active_date>/inventory/ 下查找。
morning_file_hint = "早库存单元"

# 日末库存文件名关键字。程序会在 raw_data/daily/<active_date>/inventory/ 下查找。
evening_file_hint = "晚库存单元"


[simulation]
# 前端默认选择的订单波次。
default_batch_no = "ORDER_WAVE_2025-07-01"

# 前端/后端默认日初库存快照。
default_initial_snapshot_id = "2025-07-01-morning"

# 前端/后端默认日末库存快照。
default_evening_snapshot_id = "2025-07-01-evening"

# 默认调度策略。
default_strategy = "ai"

# 默认开启站台数量。
default_active_station_limit = 16

# Whether backend simulation refreshes SKU standard picking time before each run.
auto_rebuild_sku_time = false

# 综合作业间隔，单位秒。由 backend/calibrate_operation_gap.py 使用历史数据离线校准。
# 默认值用于 AI、轮询、随机和未指定专用间隔的仿真。
operation_gap_seconds = 4.139

# 历史分配-真实订单耗时模式的全量站台综合作业间隔。
history_actual_operation_gap_seconds = 5.824

# 历史分配-SKU 平均工时模式的全量站台综合作业间隔。
history_sku_average_operation_gap_seconds = 9.415


[system]
# 产线站台总数。
num_stations = 16

# 业务完工时间阈值，单位：秒。
deadline_seconds = 30600.0

# 单个站台允许同时挂载的订单数。
max_orders_per_station = 2

# 单个站台允许同时在制/排队的基础装载单元数量。
max_boxes_per_station = 8


[model]
# 当前推荐使用的强化学习模型文件。
active_model = "ppo_masking_model_v6.zip"

# 模型输出目录。
model_dir = "output/models"

# checkpoint 目录。
checkpoint_dir = "scenarios/order_picking/checkpoints_v6"

# TensorBoard 日志目录。
tensorboard_dir = "scenarios/order_picking/ppo_tensorboard_logs_v6"


[training]
# 默认训练总步数。
total_timesteps = 3000000

# PPO 初始学习率。
initial_learning_rate = 0.0003

# PPO 后期学习率。
final_learning_rate = 0.00003

# 每轮 PPO 更新前采样步数。
n_steps = 4000

# PPO batch size。
batch_size = 1000

# 熵系数，控制探索强度。
ent_coef = 0.005

# Whether train_agent_v1.py selects the best checkpoint after a completed training run.
auto_select_best_model = true

# Evaluate every Nth checkpoint when selecting the best model.
best_model_checkpoint_stride = 5

# Fixed order count used by checkpoint selection.
best_model_eval_order_count = 2000

# Seed used when fixed evaluation orders are first generated.
best_model_eval_seed = 20260630

# Station range used by checkpoint selection.
best_model_min_stations = 2
best_model_max_stations = 16

# Fixed evaluation order cache file.
best_model_eval_orders_file = "output/model_selection/fixed_eval_orders.json"
